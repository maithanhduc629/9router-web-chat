<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9Router AI Chat Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    pre code { font-family: monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-filter blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
          9R
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">9Router Studio</h1>
          <p class="text-xs text-slate-400" id="connectionStatus">Sẵn sàng kết nối</p>
        </div>
      </div>
      <button onclick="toggleModal('settingsModal')" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Chat Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
    <div id="chatBox" class="flex-1 space-y-4 overflow-y-auto mb-4 p-2">
      <!-- Welcome Message -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-3 shadow-xl my-8">
        <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-xl">
          <i class="fa-solid fa-robot"></i>
        </div>
        <h2 class="text-xl font-bold">Chào mừng tới 9Router AI Web Interface!</h2>
        <p class="text-slate-400 text-sm max-w-md mx-auto">
          Trang web này kết nối trực tiếp tới 9Router local server hoặc ngrok tunnel của bạn để chat với các model AI.
        </p>
      </div>
    </div>

    <!-- Input Box -->
    <div class="relative bg-slate-900 border border-slate-800 rounded-2xl p-2 focus-within:border-indigo-500/50 transition">
      <textarea id="userInput" rows="3" placeholder="Nhập câu hỏi cho AI (Shift + Enter để xuống dòng)..." class="w-full bg-transparent text-slate-100 placeholder-slate-500 focus:outline-none resize-none px-3 py-2 text-sm"></textarea>
      <div class="flex items-center justify-between px-3 py-1 border-t border-slate-800/50">
        <span class="text-xs text-slate-500" id="modelLabel">Model: 9router-combo</span>
        <button id="sendBtn" onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg font-medium text-sm flex items-center space-x-2 transition shadow-md shadow-indigo-600/30">
          <span>Gửi</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-sliders text-indigo-400 mr-2"></i> Cấu hình kết nối</h3>
        <button onclick="toggleModal('settingsModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-400 mb-1">Base URL (9Router Endpoint)</label>
          <input type="text" id="baseUrl" value="http://localhost:20128/v1" placeholder="https://xxxx.ngrok-free.app/v1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
          <p class="text-[11px] text-slate-500 mt-1">Dùng URL ngrok hoặc Tunnel của 9Router.</p>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">API Key</label>
          <input type="password" id="apiKey" value="sk-9router" placeholder="sk-9router" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Model / Combo Name</label>
          <input type="text" id="modelName" value="9router-combo" placeholder="9router-combo" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button onclick="saveSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm w-full">Lưu Cấu Hình</button>
      </div>
    </div>
  </div>

  <script>
    let config = {
      baseUrl: localStorage.getItem('9r_baseUrl') || 'http://localhost:20128/v1',
      apiKey: localStorage.getItem('9r_apiKey') || 'sk-9router',
      model: localStorage.getItem('9r_model') || '9router-combo'
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('baseUrl').value = config.baseUrl;
      document.getElementById('apiKey').value = config.apiKey;
      document.getElementById('modelName').value = config.model;
      document.getElementById('modelLabel').innerText = `Model: ${config.model}`;
      
      document.getElementById('userInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    });

    function toggleModal(id) {
      const el = document.getElementById(id);
      el.classList.toggle('hidden');
      el.classList.toggle('flex');
    }

    function saveSettings() {
      config.baseUrl = document.getElementById('baseUrl').value.trim();
      config.apiKey = document.getElementById('apiKey').value.trim();
      config.model = document.getElementById('modelName').value.trim();

      localStorage.setItem('9r_baseUrl', config.baseUrl);
      localStorage.setItem('9r_apiKey', config.apiKey);
      localStorage.setItem('9r_model', config.model);

      document.getElementById('modelLabel').innerText = `Model: ${config.model}`;
      toggleModal('settingsModal');
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // User Message
      chatBox.innerHTML += `
        <div class="flex justify-end mb-4">
          <div class="bg-indigo-600 text-white max-w-xl rounded-2xl px-4 py-2.5 text-sm shadow-md">
            ${text}
          </div>
        </div>
      `;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // AI Placeholder
      const aiMsgId = 'msg-' + Date.now();
      chatBox.innerHTML += `
        <div class="flex justify-start mb-4">
          <div id="${aiMsgId}" class="bg-slate-900 border border-slate-800 text-slate-200 max-w-2xl rounded-2xl px-4 py-3 text-sm shadow-md space-y-2">
            <i class="fa-solid fa-spinner animate-spin text-indigo-400"></i> Đang kết nối 9Router...
          </div>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`${config.baseUrl}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${config.apiKey}`
          },
          body: JSON.stringify({
            model: config.model,
            messages: [{ role: 'user', content: text }],
            stream: false // Tắt chế độ stream để nhận JSON trực tiếp, tránh lỗi phân tích cú pháp
          })
        });

        const data = await response.json();
        const aiContainer = document.getElementById(aiMsgId);

        if (response.ok && data.choices && data.choices[0] && data.choices[0].message) {
          const content = data.choices[0].message.content;
          aiContainer.innerHTML = marked.parse(content);
        } else {
          aiContainer.innerHTML = `<span class="text-red-400">Lỗi từ 9Router: ${data.error ? (typeof data.error === 'object' ? data.error.message : data.error) : JSON.stringify(data)}</span>`;
        }
      } catch (err) {
        document.getElementById(aiMsgId).innerHTML = `<span class="text-red-400">Lỗi kết nối tới 9Router (${config.baseUrl}): ${err.message}</span>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
